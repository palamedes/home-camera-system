{% extends "base.html" %}
{% block title %}Tasks — Sentry{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>Tasks</h1>
    <p class="muted small">What needs doing, and who has it.</p>
  </div>
  <div class="row" style="flex: 0 0 auto; gap: 8px; align-items: center;">
    <label class="checkbox" style="flex: 0 0 auto;">
      <input type="checkbox" id="task-show-done">
      <span>Show done</span>
    </label>
    <label class="checkbox" style="flex: 0 0 auto;">
      <input type="checkbox" id="task-mine">
      <span>Only mine</span>
    </label>
    {% if is_admin %}
    <button class="btn btn-sm" id="task-add-list">Add list</button>
    {% endif %}
    <button class="btn btn-sm btn-primary" id="task-add">Add task</button>
  </div>
</div>

<div id="task-alert"></div>
<div class="task-board" id="task-board"></div>

<div class="modal-backdrop" id="task-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div class="modal-head">
      <h2 id="task-modal-title">Add task</h2>
      <button class="modal-close" id="task-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="task-modal-body"></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ asset('tasks.js') }}"></script>
<script>initTasks();</script>
{% endblock %}
